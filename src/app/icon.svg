<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#3b82f6"/>
  <!-- Calendar top bar -->
  <rect x="4" y="4" width="24" height="7" rx="2" fill="#1d4ed8"/>
  <!-- Calendar body -->
  <rect x="4" y="9" width="24" height="19" rx="2" fill="white"/>
  <!-- Binding rings -->
  <rect x="10" y="2" width="3" height="6" rx="1.5" fill="#93c5fd"/>
  <rect x="19" y="2" width="3" height="6" rx="1.5" fill="#93c5fd"/>
  <!-- Grid dots (calendar days) -->
  <rect x="8"  y="14" width="3" height="3" rx="1" fill="#3b82f6"/>
  <rect x="14" y="14" width="3" height="3" rx="1" fill="#3b82f6"/>
  <rect x="20" y="14" width="3" height="3" rx="1" fill="#3b82f6"/>
  <rect x="8"  y="20" width="3" height="3" rx="1" fill="#3b82f6"/>
  <rect x="14" y="20" width="3" height="3" rx="1" fill="#3b82f6"/>
  <rect x="20" y="20" width="3" height="3" rx="1" fill="#ef4444"/>
</svg>
